name: CI/CD
on: 
  pull_request:
  push:
    branches: main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  ci-go: # Checks code integrity and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Download the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Install go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      
      - name: Go mod tidy
        run: |
          go mod tidy
          git diff --exit-code
      
      - name: Go vet
        run: go vet ./...
      
      - name: Go build
        run: go build ./...
      
      - name: Go tests
        run: go test -v ./...

      - name: Go fmt
        run: |
          gofmt -w .
          git diff --exit-code

  ci-docker: # Builds and uploads to ghcr
    permissions:
      contents: read
      packages: write
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Download repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      
      - name: Login in GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0 
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and upload
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0 
        with:
          context: backend
          tags: |
            ghcr.io/fersuarezz/onyx-api:${{ github.sha }}
            ghcr.io/fersuarezz/onyx-api:latest
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: org.opencontainers.image.source=https://github.com/fersuarezz/Onyx # Links with repo

  
  cd: # Builds and deploys in the server via tailscale
    runs-on: ubuntu-latest
    needs: [ci-go, ci-docker]
    timeout-minutes: 10
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      SERVER_HOST: ${{ vars.SERVER_HOST }}
      SERVER_USER: ${{ vars.SERVER_USER }}
      SERVER_PATH: ${{ vars.SERVER_PATH }}
      DEPLOY_SHA: ${{ github.sha }}
    environment:
      name: prod

    steps:
      - name: Connect to tailscale
        uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf # v4.3.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      
      - name: Deploy
        run: | # Connects, fetches and checkouts to the push commit, and executes deploy.sh
          ssh -o StrictHostKeyChecking=accept-new "$SERVER_USER@$SERVER_HOST" \
            "cd '$SERVER_PATH' && git fetch origin && git checkout --detach '$DEPLOY_SHA' && ./deploy.sh '$DEPLOY_SHA'"

      - name: health-check
        run: |
          curl --fail --silent --show-error \
          --retry 10 --retry-delay 3 --retry-all-errors \
          "http://$SERVER_HOST:8081/health"
