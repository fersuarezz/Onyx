name: CI/CD
on: 
  pull_request:
  push:
    branches: main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  ci-go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Download the repo
        uses: actions/checkout@v5
      
      - name: Install go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      
      - name: Go mod tidy
        run: |
          go mod tidy
          git diff --exit-code
      
      - name: Go vet
        run: go vet ./...
      
      - name: Go build
        run: go build ./...
      
      - name: Go tests
        run: go test -v ./...

      - name: Go fmt
        run: |
          gofmt -w .
          git diff --exit-code

  ci-docker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Download repo
        uses: actions/checkout@v5

      - name: Docker builds
        run: docker build .
  
  cd:
    runs-on: ubuntu-latest
    needs: [ci-go, ci-docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      SERVER_HOST: ${{ vars.SERVER_HOST }}
      SERVER_USER: ${{ vars.SERVER_USER }}
      SERVER_PATH: ${{ vars.SERVER_PATH }}
    steps:
      - name: Connect to tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      
      - name: Deploy
        run: |
          ssh -o StrictHostKeyChecking=accept-new "$SERVER_USER@$SERVER_HOST" \
            "cd '$SERVER_PATH' && git pull --ff-only && docker compose up -d --build"
      
      - name: health-check
        run: |
          curl --fail --silent --show-error \
          --retry 10 --retry-delay 3 --retry-all-errors \
          "http://$SERVER_HOST:8081/health"
